<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">



  <!-- 1. Web App Manifest: Describe la app -->
  <link rel="manifest" href="manifest.json">

  <!-- 2. Color de la barra de estado/navegador cuando la app está en uso -->
  <meta name="theme-color" content="#6c63ff"> 

  <!-- 3. apple-mobile-web-app-capable: Permite que en iOS
          la app se abra en modo pantalla completa al añadirla
          al home screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- 4. apple-mobile-web-app-status-bar-style: Define el estilo
          de la barra de estado en dispositivos iOS -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- 5. apple-mobile-web-app-title: Nombre que aparece bajo el
          ícono en el home screen de iOS -->
  <meta name="apple-mobile-web-app-title" content="Mis Tareas">

  <!-- 6. Ícono para iOS (apple-touch-icon): iOS no usa el manifest
          para iconos; necesita esta etiqueta propia -->
  <link rel="apple-touch-icon" href="icon.png">

  <!-- SEO básico -->
  <meta name="description" content="Organiza tus tareas de forma sencilla. Funciona sin conexión como PWA.">

  <title>Mis Tareas</title>

  <!-- Google Fonts: tipografía moderna -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Fondo decorativo con burbujas animadas -->
  <div class="bg-bubbles" aria-hidden="true">
    <span></span><span></span><span></span>
    <span></span><span></span><span></span>
  </div>

  <main class="container" role="main">

    <!-- Encabezado de la app -->
    <header class="app-header">
      <div class="header-icon" aria-hidden="true">✅</div>
      <h1>Mis Tareas</h1>
      <p class="subtitle">Organiza tu día con claridad</p>
    </header>

    <!-- Formulario para agregar tareas -->
    <section class="form-section" aria-label="Agregar nueva tarea">
      <form id="todo-form" autocomplete="off">
        <div class="input-group">
          <input
            type="text"
            id="todo-input"
            placeholder="¿Qué tienes que hacer hoy?"
            aria-label="Nueva tarea"
            maxlength="100"
            required
          >
          <!-- Selector de prioridad -->
          <select id="priority-select" aria-label="Prioridad de la tarea">
            <option value="normal">⚪ Normal</option>
            <option value="alta">🔴 Alta</option>
            <option value="baja">🟢 Baja</option>
          </select>
        </div>
        <button type="submit" id="add-btn" aria-label="Agregar tarea">
          <span class="btn-icon">+</span>
          <span>Agregar</span>
        </button>
      </form>
    </section>

    <!-- Barra de estadísticas -->
    <section class="stats-bar" aria-label="Resumen de tareas">
      <div class="stat">
        <span class="stat-num" id="stat-total">0</span>
        <span class="stat-label">Total</span>
      </div>
      <div class="stat">
        <span class="stat-num" id="stat-pending">0</span>
        <span class="stat-label">Pendientes</span>
      </div>
      <div class="stat">
        <span class="stat-num" id="stat-done">0</span>
        <span class="stat-label">Completadas</span>
      </div>
    </section>

    <!-- Barra de progreso -->
    <div class="progress-bar-wrapper" aria-label="Progreso de tareas completadas">
      <div class="progress-bar" id="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
    </div>

    <!-- Filtros de tareas -->
    <nav class="filters" aria-label="Filtrar tareas">
      <button class="filter-btn active" data-filter="todas" id="filter-todas">Todas</button>
      <button class="filter-btn" data-filter="pendientes" id="filter-pendientes">Pendientes</button>
      <button class="filter-btn" data-filter="completadas" id="filter-completadas">Completadas</button>
    </nav>

    <!-- Lista de tareas -->
    <ul id="todo-list" aria-label="Lista de tareas" aria-live="polite"></ul>

    <!-- Estado vacío -->
    <div class="empty-state" id="empty-state" hidden>
      <div class="empty-icon" aria-hidden="true">🗂️</div>
      <p>¡No hay tareas aquí!</p>
      <small>Agrega una tarea usando el formulario de arriba.</small>
    </div>

    <!-- Acción de borrar completadas -->
    <footer class="app-footer">
      <button id="clear-done-btn" class="clear-btn" aria-label="Eliminar todas las tareas completadas">
        🗑️ Borrar completadas
      </button>
    </footer>

  </main>
  <script src="app.js"></script>
</body>
</html>
